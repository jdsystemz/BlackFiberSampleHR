<!DOCTYPE html>
<html>

<head>
    <title>Employees Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo-section">
            <h2>Black Fiber</h2>
        </div>

        <ul>
            <li class="active">Dashboard</li>
            <li>Applicants</li>
            <li>Employees</li>
            <li>Reports</li>
            <li>Settings</li>
        </ul>

    </aside>

    <main class="content">

        <div class="page-title">
            <h1>Employee Directory</h1>

            <p>
                24 employees currently registered
            </p>
        </div>

        <div class="stats">

            <div class="card">
                <div>
                    <h3>Total Employees</h3>
                    <p>24</p>
                </div>
            </div>

            <div class="card">
                <div>
                    <h3>Departments</h3>
                    <p>6</p>
                </div>
            </div>

            <div class="card">
                <div>
                    <h3>Active Users</h3>
                    <p>18</p>
                </div>
            </div>

        </div>

        <div class="toolbar">

            <input
                type="text"
                placeholder="Search employee..."
            >

            <button>Add Employee</button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
